<title>国庆美西衣橱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Pacifico&family=ZCOOL+KuaiLe&display=swap">
<style>
:root {
  --bg: #f8f6f7;
  --panel: #ffffff;
  --ink: #2b1f25;
  --soft: #6b5a63;
  --mute: #a3939b;
  --line: #e6dde1;
  --chip: #f3eff1;
  --accent: #c2477c;
  --accent-ink: #ffffff;
  --accent-soft: #f6e9ef;
  --warn-soft: #fbf1d6;
  --warn-ink: #7d5700;
  --cold: #4aa6d8;
  --mild: #b99ad6;
  --hot: #d9577f;
  --track: #eee8eb;
  --scrim: rgba(40, 20, 30, .36);
  --radius: 3px;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --script: "Pacifico", "Brush Script MT", cursive;
  --display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #191517; --panel: #221c1f; --ink: #f1e9ed; --soft: #bcaab3; --mute: #85757d;
    --line: #3a3035; --chip: #2d2529; --accent: #e57aa7; --accent-ink: #1c1216; --accent-soft: #3a2630;
    --warn-soft: #3d3014; --warn-ink: #f0cf7a; --cold: #6cbbe6; --mild: #c4a8e0; --hot: #e77c9c;
    --track: #30282c; --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #191517; --panel: #221c1f; --ink: #f1e9ed; --soft: #bcaab3; --mute: #85757d;
  --line: #3a3035; --chip: #2d2529; --accent: #e57aa7; --accent-ink: #1c1216; --accent-soft: #3a2630;
  --warn-soft: #3d3014; --warn-ink: #f0cf7a; --cold: #6cbbe6; --mild: #c4a8e0; --hot: #e77c9c;
  --track: #30282c; --scrim: rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.55 var(--sans);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }

/* ---------- 顶部 ---------- */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--bg);
  padding-block: 12px 12px;
  display: grid;
  gap: 10px;
  border-bottom: 1px solid var(--line);
}
.brand { display: grid; gap: 0; }
.brand .script { font: 400 26px/1.2 var(--script); color: var(--accent); }
.brand h1 { margin: 0; font: 400 20px/1.3 var(--display); letter-spacing: .06em; color: var(--ink); }
.brand .route { font: 500 11.5px/1.5 var(--mono); color: var(--mute); letter-spacing: .04em; margin-top: 2px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--soft); }
.stats b { color: var(--ink); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.stats .is-warn b { color: var(--accent); }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--ink); border-radius: var(--radius); overflow: hidden; }
.tabs button {
  border: 0; background: var(--panel); padding: 8px 10px; border-radius: 0;
  font: 400 16px var(--display); letter-spacing: .04em; color: var(--soft);
}
.tabs button + button { border-left: 1px solid var(--ink); }
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.tabs small { font: 500 12px var(--mono); opacity: .7; margin-left: 4px; }

.notice {
  margin-top: 16px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--panel); border: 1px solid var(--line); color: var(--soft);
}
.notice.is-warn { background: var(--warn-soft); border-color: transparent; color: var(--warn-ink); }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  z-index: 40; max-width: calc(100% - 32px);
  background: var(--ink); color: var(--panel); padding: 9px 16px; border-radius: var(--radius); font-size: 13px;
}

/* ---------- 每天 ---------- */
.day-list { display: grid; gap: 12px; margin-top: 16px; }
.day {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  display: grid;
  gap: 10px;
  cursor: pointer;
  transition: border-color .15s;
}
.day:hover { border-color: var(--accent); }
.day-head { display: grid; grid-template-columns: auto 1fr; column-gap: 12px; align-items: center; }
.tag {
  font: 700 15px/1.1 var(--mono);
  font-variant-numeric: tabular-nums;
  padding: 6px 8px 5px;
  border: 1.5px solid var(--ink);
  border-radius: var(--radius);
  text-align: center;
  min-width: 64px;
}
.tag small { display: block; font: 500 11px/1.3 var(--sans); color: var(--accent); margin-top: 3px; }
.day-head h3 { margin: 0; font: 400 17px/1.35 var(--display); letter-spacing: .03em; text-wrap: balance; }
.day-head .sub { font-size: 13px; color: var(--soft); }

.temp { display: grid; grid-template-columns: 38px 1fr 38px; align-items: center; gap: 8px; font: 700 13px var(--mono); font-variant-numeric: tabular-nums; }
.temp .lo { text-align: right; color: var(--cold); }
.temp .hi { color: var(--hot); }
.track { position: relative; height: 8px; background: var(--track); border-radius: 1px; }
.track i {
  position: absolute; top: 0; bottom: 0; border-radius: 1px;
  background-image: linear-gradient(90deg, var(--cold) 0%, var(--cold) 15%, var(--mild) 50%, var(--hot) 85%, var(--hot) 100%);
  background-repeat: no-repeat;
}
.track b { position: absolute; top: -4px; bottom: -4px; width: 1.5px; background: var(--mute); }
.track b::after { content: "0°"; position: absolute; top: 14px; left: -6px; font: 500 9px var(--mono); color: var(--mute); }

.wear { display: grid; gap: 6px; }
.wear-row { display: grid; grid-template-columns: 58px 1fr; gap: 8px; align-items: baseline; }
.wear-row > span { font-size: 12px; color: var(--mute); letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 9px; border-radius: var(--radius);
  background: var(--chip); color: var(--ink);
  font-size: 13.5px; line-height: 1.5;
}
.empty-wear { font-size: 13px; color: var(--mute); }
.day-note { font-size: 13px; color: var(--soft); border-left: 2px solid var(--accent); padding-left: 8px; white-space: pre-wrap; }
.warns { display: flex; flex-wrap: wrap; gap: 6px; }
.warn { font-size: 12.5px; color: var(--warn-ink); background: var(--warn-soft); padding: 2px 9px; border-radius: var(--radius); }
.ok { font-size: 13px; color: var(--accent); }

/* ---------- 衣服 ---------- */
.add {
  margin-top: 16px;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px; display: grid; gap: 10px;
}
.add h2 { margin: 0; font: 400 18px var(--display); letter-spacing: .04em; }
.add-row { display: flex; gap: 8px; }
.add-row input { flex: 1; min-width: 0; }
input[type="text"], textarea, select {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; width: 100%;
}
input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none; }
input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
textarea { resize: vertical; min-height: 64px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 3px 11px; font-size: 13px; color: var(--soft);
}
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.btn {
  border: 0; border-radius: var(--radius); padding: 8px 16px; font-weight: 600;
  background: var(--accent); color: var(--accent-ink); white-space: nowrap;
}
.btn.ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.danger { background: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: default; }

.filter { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--soft); }
.cat-block { margin-top: 18px; }
.cat-block h3 {
  margin: 0 0 6px; font: 400 15px var(--display); letter-spacing: .1em; color: var(--ink);
  display: flex; justify-content: space-between;
}
.cat-block h3 span:last-child { font: 500 12px var(--mono); letter-spacing: 0; color: var(--mute); }
.items { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 12px; align-items: center; }
.item + .item { border-top: 1px solid var(--line); }
.item .name { font-weight: 600; }
.item .use { grid-column: 1; font-size: 12.5px; color: var(--soft); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.item .use .n { font: 700 12px var(--mono); color: var(--ink); }
.item .use .d { font: 500 11.5px var(--mono); color: var(--mute); }
.item .use.none { color: var(--accent); }
.item .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
.item .acts button { border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius); padding: 3px 10px; font-size: 12.5px; color: var(--soft); }
.item.editing, .item.confirming { grid-template-columns: 1fr; }
.item.editing .acts, .item.confirming .acts { grid-column: 1; grid-row: auto; }
.item.confirming p { margin: 0; font-size: 13.5px; }

/* ---------- 搭配面板 ---------- */
.sheet { position: fixed; inset: 0; z-index: 30; display: grid; align-items: end; justify-items: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative; width: 100%; max-width: 640px; max-height: 90%;
  background: var(--panel); border-radius: var(--radius) var(--radius) 0 0;
  display: grid; grid-template-rows: auto 1fr auto; overflow: hidden;
}
.sheet-top {
  display: grid; gap: 10px;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
}
.sheet-top h2 { margin: 0; font: 400 18px/1.35 var(--display); letter-spacing: .03em; text-wrap: balance; }
.sheet-top .meta { font: 500 12.5px var(--mono); color: var(--soft); margin-top: 2px; }
.sheet-scroll { overflow-y: auto; padding: 12px 16px 16px; display: grid; gap: 14px; align-content: start; }
.sheet-foot {
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
}
.sheet-foot .btn { width: 100%; padding-block: 11px; font-size: 16px; }
#sheet-picks { display: grid; gap: 14px; }
.pick-group h4 { margin: 0 0 6px; font: 400 14px var(--display); letter-spacing: .1em; color: var(--soft); }
.pick {
  border: 1px solid var(--line); background: var(--panel); border-radius: var(--radius);
  padding: 4px 11px; font-size: 14px; display: inline-flex; gap: 5px; align-items: baseline;
}
.pick small { font: 500 11px var(--mono); color: var(--mute); }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pick[aria-pressed="true"]::before { content: "♥"; font-size: 11px; }
.pick[aria-pressed="true"] small { color: inherit; opacity: .8; }
.sheet-tools { display: flex; flex-wrap: wrap; gap: 8px; }
.plan { font-size: 13.5px; color: var(--soft); background: var(--bg); border-radius: var(--radius); padding: 10px 12px; }
.plan summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.plan p { margin: 8px 0 0; white-space: pre-wrap; }
.field { display: grid; gap: 6px; font-size: 13px; color: var(--soft); }
.quick .row { display: grid; grid-template-columns: 1fr 92px auto; gap: 8px; }
@media (max-width: 420px) { .quick .row { grid-template-columns: 1fr 84px auto; } .quick input { font-size: 14px; } }

@media (min-width: 700px) {
  .sheet { align-items: center; }
  .panel { border-radius: var(--radius); max-height: 86%; }
}
@media (prefers-reduced-motion: no-preference) {
  .panel { animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="script" aria-hidden="true">Dream Closet</span>
      <h1>国庆美西衣橱</h1>
      <span class="route">SFO · LAX · LAS · PAGE · SLC · 黄石 · 9/25–10/9</span>
    </div>
    <div class="stats" id="stats">正在读取…</div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-days" data-tab="days" aria-selected="true">每天穿什么<small id="tab-days-n"></small></button>
      <button type="button" role="tab" id="tab-items" data-tab="items" aria-selected="false">我的衣服<small id="tab-items-n"></small></button>
    </div>
  </header>

  <div id="notice"></div>

  <section id="view-days" role="tabpanel" aria-labelledby="tab-days">
    <div class="day-list" id="day-list"></div>
  </section>

  <section id="view-items" role="tabpanel" aria-labelledby="tab-items" hidden>
    <form class="add" id="add-form" autocomplete="off">
      <h2>加一件衣服</h2>
      <div class="add-row">
        <input type="text" id="add-name" placeholder="比如：灰色卫衣" maxlength="40" aria-label="衣服名称">
        <button class="btn" type="submit" id="add-btn">添加</button>
      </div>
      <div class="seg" id="add-cat" aria-label="类别"></div>
    </form>
    <label class="filter"><input type="checkbox" id="only-unused"> 只看还没安排到任何一天的</label>
    <div id="item-list"></div>
  </section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="scrim" data-act="close"></div>
  <div class="panel">
    <div class="sheet-top">
      <div>
        <h2 id="sheet-title"></h2>
        <div class="meta" id="sheet-meta"></div>
      </div>
      <form class="quick" id="quick-form" autocomplete="off">
        <div class="row">
          <input type="text" id="quick-name" placeholder="加一件新衣服" maxlength="40" aria-label="新衣服名称">
          <select id="quick-cat" aria-label="类别"></select>
          <button class="btn" type="submit">加上</button>
        </div>
      </form>
    </div>
    <div class="sheet-scroll">
      <div class="warns" id="sheet-warns"></div>
      <div id="sheet-picks"></div>
      <div class="sheet-tools">
        <button class="btn ghost" type="button" id="copy-prev">照搬前一天</button>
        <button class="btn ghost" type="button" id="clear-day">清空这天</button>
      </div>
      <details class="plan" id="sheet-plan-box">
        <summary>原计划</summary>
        <p id="sheet-plan"></p>
      </details>
      <label class="field">备注（提醒自己的话）
        <textarea id="sheet-note" maxlength="500" placeholder="比如：洞洞鞋放随身包"></textarea>
      </label>
    </div>
    <div class="sheet-foot">
      <button class="btn" type="button" id="sheet-done" data-act="close">完成</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  const CATS = ['上衣', '中间层', '外套', '保暖内衣', '下装', '鞋', '配件'];
  const TMIN = -5, TMAX = 35;

  const S = {
    db: null,
    items: new Map(),
    days: [],
    outfits: new Map(),
    loaded: { items: false, days: false, outfits: false },
    tab: 'days',
    openDay: null,
    addCat: '上衣',
    editId: null,
    editDraft: null,
    confirmId: null,
    onlyUnused: false,
    failed: false
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  try { const t = localStorage.getItem('outfit-tab'); if (t === 'items' || t === 'days') S.tab = t; } catch (e) {}

  /* ---------- 小工具 ---------- */
  let toastTimer = 0;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
  }
  function errText(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded') return '存储满了，删掉几件不用的再加';
    if (code === 'invalid_argument') return '没有保存权限，只能看';
    if (code === 'resource_exhausted') return '点得太快了，稍等一下再试';
    return '没保存上，检查一下网络再点一次';
  }
  async function withRetry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && (e.code === 'unavailable' || !e.code)) {
        await new Promise((r) => setTimeout(r, 400 + Math.random() * 600));
        return fn();
      }
      throw e;
    }
  }
  function newId() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function sortedItems() {
    return Array.from(S.items.values()).sort((a, b) =>
      (CATS.indexOf(a.cat) - CATS.indexOf(b.cat)) || ((a.order || 0) - (b.order || 0)));
  }
  function outfitOf(dayId) {
    const o = S.outfits.get(dayId);
    return { items: (o && Array.isArray(o.items)) ? o.items.filter((id) => S.items.has(id)) : [], note: (o && o.note) || '' };
  }
  function usage() {
    const map = new Map();
    for (const d of S.days) {
      for (const id of outfitOf(d.id).items) {
        if (!map.has(id)) map.set(id, []);
        map.get(id).push(d);
      }
    }
    return map;
  }
  function warningsFor(day) {
    const cats = new Set(outfitOf(day.id).items.map((id) => S.items.get(id).cat));
    const out = [];
    if (!cats.size) return ['还没搭配'];
    if (!cats.has('上衣') && !cats.has('保暖内衣')) out.push('还没选上衣');
    if (!cats.has('下装')) out.push('还没选裤子 / 裙子');
    if (!cats.has('鞋')) out.push('还没选鞋');
    if (typeof day.lo === 'number' && day.lo <= 5 && !cats.has('外套')) out.push('最低 ' + day.lo + '°C，还没有外套');
    if (typeof day.lo === 'number' && day.lo <= 0 && !cats.has('保暖内衣')) out.push('会到 0°C 以下，考虑保暖内衣');
    return out;
  }
  function tempPos(t) { return Math.max(0, Math.min(100, (t - TMIN) / (TMAX - TMIN) * 100)); }
  function trackHtml(lo, hi) {
    if (typeof lo !== 'number' || typeof hi !== 'number') return '';
    const a = tempPos(lo), b = tempPos(hi), w = Math.max(b - a, 2);
    const size = 100 / w * 100;
    const pos = (100 - w) > 0 ? a / (100 - w) * 100 : 0;
    const zero = tempPos(0);
    return '<div class="temp"><span class="lo">' + lo + '°</span>' +
      '<div class="track" aria-label="气温 ' + lo + ' 到 ' + hi + ' 摄氏度">' +
      '<i style="left:' + a + '%;width:' + w + '%;background-size:' + size + '% 100%;background-position:' + pos + '% 0"></i>' +
      '<b style="left:' + zero + '%"></b></div>' +
      '<span class="hi">' + hi + '°</span></div>';
  }

  /* ---------- 渲染 ---------- */
  function render() {
    const ready = S.loaded.items && S.loaded.days && S.loaded.outfits;
    $('tab-days').setAttribute('aria-selected', String(S.tab === 'days'));
    $('tab-items').setAttribute('aria-selected', String(S.tab === 'items'));
    $('view-days').hidden = S.tab !== 'days';
    $('view-items').hidden = S.tab !== 'items';
    if (!ready) return;

    const use = usage();
    const unused = sortedItems().filter((it) => !use.has(it.id));
    const warnDays = S.days.filter((d) => warningsFor(d).length);
    $('stats').innerHTML =
      '<span><b>' + S.items.size + '</b> 件衣服</span>' +
      '<span><b>' + (S.days.length - warnDays.length) + '/' + S.days.length + '</b> 天搭好</span>' +
      '<span class="' + (unused.length ? 'is-warn' : '') + '"><b>' + unused.length + '</b> 件还没安排</span>';
    $('tab-days-n').textContent = S.days.length;
    $('tab-items-n').textContent = S.items.size;

    renderDays();
    renderItems(use);
    if (S.openDay) renderSheet();
  }

  function renderDays() {
    if (!S.days.length) {
      $('day-list').innerHTML = '<div class="notice">行程还没导进来。</div>';
      return;
    }
    $('day-list').innerHTML = S.days.map((d) => {
      const o = outfitOf(d.id);
      const byCat = CATS.map((c) => [c, o.items.map((id) => S.items.get(id)).filter((it) => it.cat === c)]).filter(([, l]) => l.length);
      const warns = warningsFor(d);
      return '<article class="day" data-day="' + esc(d.id) + '" tabindex="0" aria-label="' + esc(d.date + ' ' + d.title) + '，点开搭配">' +
        '<div class="day-head"><div class="tag">' + esc(d.date) + '<small>' + esc(d.wd || '') + '</small></div>' +
        '<div><h3>' + esc(d.title) + '</h3>' + (d.sub ? '<div class="sub">' + esc(d.sub) + '</div>' : '') + '</div></div>' +
        trackHtml(d.lo, d.hi) +
        (byCat.length
          ? '<div class="wear">' + byCat.map(([c, l]) => '<div class="wear-row"><span>' + c + '</span><div class="chips">' +
              l.map((it) => '<span class="chip">' + esc(it.name) + '</span>').join('') + '</div></div>').join('') + '</div>'
          : '<div class="empty-wear">点这里开始搭配</div>') +
        (o.note ? '<div class="day-note">' + esc(o.note) + '</div>' : '') +
        (warns.length && byCat.length ? '<div class="warns">' + warns.map((w) => '<span class="warn">' + esc(w) + '</span>').join('') + '</div>' : '') +
        (!warns.length ? '<div class="ok">♥ 搭好了</div>' : '') +
        '</article>';
    }).join('');
  }

  function renderItems(use) {
    $('add-cat').innerHTML = CATS.map((c) => '<button type="button" data-cat="' + c + '" aria-pressed="' + (S.addCat === c) + '">' + c + '</button>').join('');
    let list = sortedItems();
    if (S.onlyUnused) list = list.filter((it) => !use.has(it.id));
    if (!list.length) {
      $('item-list').innerHTML = '<div class="notice">' + (S.onlyUnused ? '每件衣服都安排上了。' : '还没有衣服，先在上面加几件。') + '</div>';
      return;
    }
    $('item-list').innerHTML = CATS.map((c) => {
      const l = list.filter((it) => it.cat === c);
      if (!l.length) return '';
      return '<div class="cat-block"><h3><span>' + c + '</span><span>' + l.length + '</span></h3><div class="items">' +
        l.map((it) => itemRow(it, use.get(it.id) || [])).join('') + '</div></div>';
    }).join('');
  }

  function itemRow(it, days) {
    const id = esc(it.id);
    if (S.editId === it.id) {
      const d = S.editDraft || { name: it.name, cat: it.cat };
      return '<div class="item editing" data-item="' + id + '">' +
        '<input type="text" id="edit-name" value="' + esc(d.name) + '" maxlength="40" aria-label="名称">' +
        '<div class="seg" id="edit-cat">' + CATS.map((c) => '<button type="button" data-editcat="' + c + '" aria-pressed="' + (d.cat === c) + '">' + c + '</button>').join('') + '</div>' +
        '<div class="acts"><button type="button" class="btn" data-act="save-edit">保存</button><button type="button" class="btn ghost" data-act="cancel-edit">取消</button></div></div>';
    }
    if (S.confirmId === it.id) {
      return '<div class="item confirming" data-item="' + id + '">' +
        '<p>删掉「' + esc(it.name) + '」？' + (days.length ? '会从 ' + days.length + ' 天的搭配里一起拿掉。' : '') + '</p>' +
        '<div class="acts"><button type="button" class="btn danger" data-act="do-delete">删掉</button><button type="button" class="btn ghost" data-act="cancel-delete">不删</button></div></div>';
    }
    const useHtml = days.length
      ? '<div class="use"><span class="n">穿 ' + days.length + ' 天</span>' + days.map((d) => '<span class="d">' + esc(d.date) + '</span>').join('') + '</div>'
      : '<div class="use none">还没安排到任何一天</div>';
    return '<div class="item" data-item="' + id + '"><div class="name">' + esc(it.name) + '</div>' + useHtml +
      '<div class="acts"><button type="button" data-act="edit">改</button><button type="button" data-act="delete">删</button></div></div>';
  }

  function renderSheet() {
    const d = S.days.find((x) => x.id === S.openDay);
    if (!d) { closeSheet(); return; }
    const o = outfitOf(d.id);
    const chosen = new Set(o.items);
    const use = usage();
    $('sheet-title').textContent = d.date + ' ' + (d.wd || '') + ' · ' + d.title;
    $('sheet-meta').textContent = (typeof d.lo === 'number' ? d.lo + '°C – ' + d.hi + '°C' : '') + (d.sub ? '  ·  ' + d.sub : '');
    const warns = warningsFor(d);
    $('sheet-warns').innerHTML = warns.length
      ? warns.map((w) => '<span class="warn">' + esc(w) + '</span>').join('')
      : '<span class="ok">♥ 搭好了</span>';
    $('sheet-picks').innerHTML = CATS.map((c) => {
      const l = sortedItems().filter((it) => it.cat === c);
      if (!l.length) return '';
      return '<div class="pick-group"><h4>' + c + '</h4><div class="chips">' + l.map((it) => {
        const others = (use.get(it.id) || []).filter((x) => x.id !== d.id).length;
        return '<button type="button" class="pick" data-pick="' + esc(it.id) + '" aria-pressed="' + chosen.has(it.id) + '">' +
          esc(it.name) + (others ? '<small>' + others + '天</small>' : '') + '</button>';
      }).join('') + '</div></div>';
    }).join('') || '<div class="notice">还没有衣服。先去「我的衣服」加，或者用下面的输入框直接加。</div>';
    const idx = S.days.indexOf(d);
    $('copy-prev').hidden = idx <= 0;
    if (idx > 0) $('copy-prev').textContent = '照搬前一天（' + S.days[idx - 1].date + '）';
    $('clear-day').disabled = !o.items.length;
    $('sheet-plan-box').hidden = !d.plan;
    $('sheet-plan').textContent = d.plan || '';
    if (document.activeElement !== $('sheet-note') && !noteTimer) $('sheet-note').value = o.note;
    $('quick-cat').innerHTML = CATS.map((c) => '<option' + (c === S.quickCat ? ' selected' : '') + '>' + c + '</option>').join('');
  }

  /* ---------- 写入 ---------- */
  const pending = new Map();
  const busy = new Set();
  function saveOutfit(dayId, body) {
    S.outfits.set(dayId, body);
    pending.set(dayId, body);
    flush(dayId);
    render();
  }
  async function flush(dayId) {
    if (busy.has(dayId) || !S.db) return;
    busy.add(dayId);
    try {
      while (pending.has(dayId)) {
        const body = pending.get(dayId);
        pending.delete(dayId);
        await withRetry(() => S.db.doc('outfits/' + dayId).set(body));
      }
    } catch (e) {
      pending.delete(dayId);
      toast(errText(e));
    } finally {
      busy.delete(dayId);
    }
  }

  async function addItem(name, cat) {
    name = name.trim();
    if (!name) return null;
    if (sortedItems().some((it) => it.name === name)) { toast('已经有「' + name + '」了'); return null; }
    const id = newId();
    const body = { name: name, cat: cat, order: Date.now() };
    S.items.set(id, Object.assign({ id: id }, body));
    render();
    try {
      await withRetry(() => S.db.doc('items/' + id).set(body));
      return id;
    } catch (e) {
      S.items.delete(id);
      render();
      toast(errText(e));
      return null;
    }
  }

  async function deleteItem(id) {
    const it = S.items.get(id);
    if (!it) return;
    for (const d of S.days) {
      const o = outfitOf(d.id);
      if (o.items.includes(id)) saveOutfit(d.id, { items: o.items.filter((x) => x !== id), note: o.note });
    }
    S.items.delete(id);
    render();
    try { await withRetry(() => S.db.doc('items/' + id).delete()); toast('删掉了「' + it.name + '」'); }
    catch (e) { toast(errText(e)); }
  }

  async function saveEdit(id) {
    const it = S.items.get(id);
    const d = S.editDraft;
    if (!it || !d) return;
    const name = d.name.trim();
    if (!name) { toast('名称不能空着'); return; }
    S.editId = null; S.editDraft = null;
    if (name === it.name && d.cat === it.cat) { render(); return; }
    S.items.set(id, Object.assign({}, it, { name: name, cat: d.cat }));
    render();
    try { await withRetry(() => S.db.doc('items/' + id).update({ name: name, cat: d.cat })); }
    catch (e) { toast(errText(e)); }
  }

  /* ---------- 面板 ---------- */
  let lastFocus = null;
  function openSheet(dayId) {
    lastFocus = document.activeElement;
    S.openDay = dayId;
    S.quickCat = S.quickCat || '上衣';
    $('sheet-note').value = outfitOf(dayId).note;
    $('sheet-plan-box').open = false;
    $('sheet').hidden = false;
    document.body.style.overflow = 'hidden';
    renderSheet();
    $('sheet-done').focus();
  }
  function closeSheet() {
    flushNote();
    S.openDay = null;
    $('sheet').hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  let noteTimer = 0;
  function flushNote() {
    if (!noteTimer || !S.openDay) return;
    clearTimeout(noteTimer);
    noteTimer = 0;
    const o = outfitOf(S.openDay);
    const note = $('sheet-note').value.trim();
    if (note !== o.note) saveOutfit(S.openDay, { items: o.items, note: note });
  }

  /* ---------- 事件 ---------- */
  document.querySelector('.tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if (!b) return;
    S.tab = b.dataset.tab;
    try { localStorage.setItem('outfit-tab', S.tab); } catch (err) {}
    render();
    window.scrollTo(0, 0);
  });

  $('day-list').addEventListener('click', (e) => {
    const card = e.target.closest('[data-day]');
    if (card) openSheet(card.dataset.day);
  });
  $('day-list').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('[data-day]');
    if (card) { e.preventDefault(); openSheet(card.dataset.day); }
  });

  $('add-cat').addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]');
    if (!b) return;
    S.addCat = b.dataset.cat;
    render();
  });
  $('add-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('add-name');
    const name = input.value;
    if (!name.trim()) { input.focus(); return; }
    input.value = '';
    const id = await addItem(name, S.addCat);
    if (id) toast('加上了「' + name.trim() + '」· ' + S.addCat);
    input.focus();
  });
  $('only-unused').addEventListener('change', (e) => { S.onlyUnused = e.target.checked; render(); });

  $('item-list').addEventListener('click', (e) => {
    const row = e.target.closest('[data-item]');
    if (!row) return;
    const id = row.dataset.item;
    const cat = e.target.closest('[data-editcat]');
    if (cat) { S.editDraft.cat = cat.dataset.editcat; render(); return; }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'edit') {
      const it = S.items.get(id);
      S.editId = id; S.confirmId = null;
      S.editDraft = { name: it.name, cat: it.cat };
      render();
      const inp = $('edit-name'); if (inp) { inp.focus(); inp.select(); }
    } else if (a === 'cancel-edit') { S.editId = null; S.editDraft = null; render(); }
    else if (a === 'save-edit') saveEdit(id);
    else if (a === 'delete') { S.confirmId = id; S.editId = null; render(); }
    else if (a === 'cancel-delete') { S.confirmId = null; render(); }
    else if (a === 'do-delete') { S.confirmId = null; deleteItem(id); }
  });
  $('item-list').addEventListener('input', (e) => {
    if (e.target.id === 'edit-name' && S.editDraft) S.editDraft.name = e.target.value;
  });
  $('item-list').addEventListener('keydown', (e) => {
    if (e.target.id === 'edit-name' && e.key === 'Enter') { e.preventDefault(); saveEdit(S.editId); }
  });

  $('sheet').addEventListener('click', (e) => {
    if (e.target.closest('[data-act="close"]')) { closeSheet(); return; }
    const p = e.target.closest('[data-pick]');
    if (p && S.openDay) {
      const o = outfitOf(S.openDay);
      const id = p.dataset.pick;
      const items = o.items.includes(id) ? o.items.filter((x) => x !== id) : o.items.concat(id);
      saveOutfit(S.openDay, { items: items, note: o.note });
    }
  });
  $('copy-prev').addEventListener('click', () => {
    const idx = S.days.findIndex((x) => x.id === S.openDay);
    if (idx <= 0) return;
    const prev = outfitOf(S.days[idx - 1].id);
    const o = outfitOf(S.openDay);
    saveOutfit(S.openDay, { items: prev.items.slice(), note: o.note });
    toast('照搬了 ' + S.days[idx - 1].date + ' 的 ' + prev.items.length + ' 件');
  });
  $('clear-day').addEventListener('click', () => {
    const o = outfitOf(S.openDay);
    saveOutfit(S.openDay, { items: [], note: o.note });
  });
  $('sheet-note').addEventListener('input', () => {
    clearTimeout(noteTimer);
    noteTimer = setTimeout(flushNote, 700);
  });
  $('sheet-note').addEventListener('blur', flushNote);
  $('quick-cat').addEventListener('change', (e) => { S.quickCat = e.target.value; });
  $('quick-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = $('quick-name');
    const name = input.value;
    const dayId = S.openDay;
    if (!name.trim() || !dayId) { input.focus(); return; }
    input.value = '';
    const id = await addItem(name, $('quick-cat').value);
    if (id && S.openDay === dayId) {
      const o = outfitOf(dayId);
      saveOutfit(dayId, { items: o.items.concat(id), note: o.note });
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.openDay) closeSheet(); });

  /* ---------- 连接存储 ---------- */
  function fail(msg) {
    S.failed = true;
    $('stats').textContent = '';
    $('notice').innerHTML = '<div class="notice is-warn">' + msg + '</div>';
  }
  function onDbError(e) {
    if (e && e.code === 'revoked') fail('这个页面的存储权限被收回了，刷新一下试试。');
    else toast('同步断了，刷新一下页面');
  }

  render();
  const hasClaude = window.claude && typeof window.claude.use === 'function';
  if (!hasClaude) {
    fail('这个页面要在 claude.ai 里打开才能读写数据。');
  } else {
    window.claude.use('db').then((db) => {
      if (!db) { fail('读不到存储。刷新一下；还不行的话，用分享给你的 claude.ai 链接打开。'); return; }
      S.db = db;
      db.collection('items').onSnapshot((snap) => {
        const next = new Map();
        for (const d of snap.docs) next.set(d.id, Object.assign({ id: d.id }, d.data()));
        S.items = next;
        S.loaded.items = true;
        render();
      }, onDbError);
      db.collection('days').orderBy('order').onSnapshot((snap) => {
        S.days = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
        S.loaded.days = true;
        render();
      }, onDbError);
      db.collection('outfits').onSnapshot((snap) => {
        const next = new Map();
        for (const d of snap.docs) next.set(d.id, d.data());
        for (const id of busy) if (S.outfits.has(id)) next.set(id, S.outfits.get(id));
        for (const [id, body] of pending) next.set(id, body);
        S.outfits = next;
        S.loaded.outfits = true;
        render();
      }, onDbError);
    }, () => fail('读不到存储，刷新一下试试。'));
  }
})();
</script>
