<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>US Routine · 美国行程时间轴</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="US Routine" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🗺️</div>
    <input id="tripTitle" class="trip-title" placeholder="行程名称" />

    <div id="presence" class="presence"></div>
    <button id="undoBtn" class="tool-btn" title="撤销我最近一次改动（Ctrl/⌘ + Z）">↩️</button>
    <button id="shareBtn" class="tool-btn accent">👥 邀请</button>

    <div class="menu-wrap">
      <button id="menuBtn" class="tool-btn" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div id="menu" class="menu" hidden>
        <button id="refreshBtn" class="menu-item">🔄 刷新路程时间</button>
        <button id="copyBtn" class="menu-item">📋 复制当天行程</button>
        <button id="historyBtn" class="menu-item">🕘 修改记录 / 撤销</button>
        <button id="exportBtn" class="menu-item">⬇️ 导出 JSON</button>
        <label class="menu-item" for="importInput">⬆️ 导入 JSON</label>
        <button id="sampleBtn" class="menu-item">✨ 载入示例行程</button>
        <button id="newTripBtn" class="menu-item">🆕 新建一个行程</button>
        <div class="menu-sep"></div>
        <button id="settingsBtn" class="menu-item">⚙️ 设置（Key / 昵称）</button>
      </div>
    </div>
    <input id="importInput" type="file" accept="application/json" hidden />
  </header>

  <div id="syncBar" class="sync-bar" hidden></div>

  <div class="layout" id="layout" data-view="list">
    <aside class="panel">
      <div id="dayTabs" class="daytabs"></div>
      <div id="dayMeta" class="daymeta"></div>
      <div id="timeline" class="timeline"></div>
      <div class="panel-footer">
        <button id="addStopBtn" class="primary-btn">+ 添加地点</button>
      </div>
    </aside>

    <main class="mapwrap">
      <div id="map" class="map"></div>
      <div id="mapStatus" class="map-status" hidden></div>
      <div id="mapNotice" class="map-notice" hidden></div>
    </main>
  </div>

  <nav class="mobile-tabs">
    <button class="mobile-tab is-active" data-view="list">📋 行程</button>
    <button class="mobile-tab" data-view="map">🗺️ 地图</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <!-- 地点编辑 -->
  <dialog id="stopDialog" class="dialog">
    <form id="stopForm" method="dialog" class="dialog-form">
      <h2 id="stopDialogTitle">添加地点</h2>

      <label class="field">
        <span>搜索地点</span>
        <input id="f-search" type="text" placeholder="配好 Maps Key 后可搜索，自动带回地址和坐标" autocomplete="off" />
      </label>

      <div class="field-row">
        <label class="field">
          <span>名称</span>
          <input id="f-name" type="text" required />
        </label>
        <label class="field field-narrow">
          <span>类型</span>
          <select id="f-category">
            <option value="attraction">🏛️ 景点</option>
            <option value="food">🍜 吃饭</option>
            <option value="hotel">🏨 住宿</option>
            <option value="outdoor">🏞️ 户外</option>
            <option value="shopping">🛍️ 购物</option>
            <option value="transport">✈️ 交通</option>
            <option value="other">📍 其他</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>地址</span>
        <input id="f-address" type="text" />
      </label>

      <div class="field-row">
        <label class="field"><span>纬度 lat</span><input id="f-lat" type="text" inputmode="decimal" /></label>
        <label class="field"><span>经度 lng</span><input id="f-lng" type="text" inputmode="decimal" /></label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>停留（分钟）</span>
          <input id="f-stay" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label class="field">
          <span>怎么过来</span>
          <select id="f-mode">
            <option value="DRIVING">🚗 开车</option>
            <option value="TRANSIT">🚇 公共交通</option>
            <option value="WALKING">🚶 步行</option>
            <option value="BICYCLING">🚲 骑行</option>
          </select>
        </label>
        <label class="field">
          <span>固定时间</span>
          <input id="f-fixed" type="time" title="有预约 / 门票时段时填，系统会倒推最晚出发时间" />
        </label>
      </div>

      <label class="field">
        <span>备注</span>
        <textarea id="f-notes" rows="2" placeholder="订位号、停车提示、必点菜…"></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" id="stopCancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 邀请朋友 -->
  <dialog id="shareDialog" class="dialog">
    <div class="dialog-form">
      <h2>邀请朋友一起改</h2>
      <p class="dialog-hint" id="shareHint"></p>
      <label class="field">
        <span>行程链接</span>
        <input id="shareLink" type="text" readonly />
      </label>
      <div class="share-actions">
        <button id="shareCopy" class="primary-btn">复制链接</button>
        <button id="shareSystem" class="tool-btn">分享到…</button>
      </div>
      <div id="shareMembers" class="share-members"></div>
      <div class="dialog-actions">
        <button type="button" id="shareClose" class="tool-btn">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 修改记录 -->
  <dialog id="historyDialog" class="dialog">
    <div class="dialog-form">
      <div class="history-head">
        <h2>修改记录 <span id="historyCount" class="history-count"></span></h2>
        <button id="historyMineBtn" class="tool-btn">只看我的</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div class="dialog-actions">
        <button type="button" id="historyClose" class="tool-btn">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 设置 -->
  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" method="dialog" class="dialog-form">
      <h2>设置</h2>

      <label class="field">
        <span>我的昵称（朋友会看到）</span>
        <input id="f-nick" type="text" maxlength="12" />
      </label>

      <label class="field">
        <span>Google Maps API Key</span>
        <input id="f-key" type="text" placeholder="AIza..." autocomplete="off" />
      </label>

      <label class="field">
        <span>Firebase 配置（从控制台复制的 firebaseConfig 对象，直接粘贴）</span>
        <textarea id="f-fb" rows="6" placeholder='{ "apiKey": "...", "authDomain": "...", "databaseURL": "https://xxx.firebasedatabase.app", "projectId": "...", "appId": "..." }'></textarea>
      </label>

      <p class="dialog-hint" id="configSource"></p>

      <div class="dialog-actions">
        <button type="button" id="settingsClear" class="tool-btn">清除本地配置</button>
        <button type="button" id="settingsCancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">保存并刷新</button>
      </div>
    </form>
  </dialog>

  <script src="js/app-config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/dragsort.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
