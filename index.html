<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>US Routine · 美国行程时间轴</title>
  <meta name="theme-color" content="#2563eb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="US Routine" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🗺️</div>
    <input id="tripTitle" class="trip-title" placeholder="行程名称" />

    <div id="presence" class="presence"></div>
    <button id="undoBtn" class="tool-btn" title="撤销我最近一次改动（Ctrl/⌘ + Z）">↩️</button>
    <button id="shareBtn" class="tool-btn accent">👥 邀请</button>

    <div class="menu-wrap">
      <button id="menuBtn" class="tool-btn" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div id="menu" class="menu" hidden>
        <button id="refreshBtn" class="menu-item">🔄 刷新路程时间</button>
        <button id="sortBtn" class="menu-item">⇅ 按固定时间重排当天</button>
        <button id="reorderBtn" class="menu-item">🔄 看看顺序能不能更省</button>
        <button id="copyBtn" class="menu-item">📋 复制当天行程</button>
        <button id="historyBtn" class="menu-item">🕘 修改记录 / 撤销</button>
        <button id="exportBtn" class="menu-item">⬇️ 导出 JSON</button>
        <label class="menu-item" for="importInput">⬆️ 导入 JSON</label>
        <button id="sampleBtn" class="menu-item">✨ 载入示例行程</button>
        <button id="newTripBtn" class="menu-item">🆕 新建一个行程</button>
        <button id="openLinkBtn" class="menu-item">🔗 打开行程链接</button>
        <div class="menu-sep"></div>
        <button id="settingsBtn" class="menu-item">⚙️ 设置（Key / 昵称）</button>
      </div>
    </div>
    <input id="importInput" type="file" accept="application/json" hidden />
  </header>

  <div id="syncBar" class="sync-bar" hidden></div>

  <div class="layout" id="layout" data-view="list">
    <aside class="panel">
      <div id="dayTabs" class="daytabs"></div>
      <div id="dayMeta" class="daymeta"></div>
      <div id="timeline" class="timeline"></div>
      <div class="panel-footer">
        <button id="addStopBtn" class="primary-btn">+ 添加地点</button>
      </div>
    </aside>

    <main class="mapwrap">
      <div id="map" class="map"></div>
      <div id="mapStatus" class="map-status" hidden></div>
      <div id="mapNotice" class="map-notice" hidden></div>
    </main>
  </div>

  <nav class="mobile-tabs">
    <button class="mobile-tab is-active" data-view="list">📋 行程</button>
    <button class="mobile-tab" data-view="map">🗺️ 地图</button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <!-- 地点编辑 -->
  <dialog id="stopDialog" class="dialog">
    <form id="stopForm" method="dialog" class="dialog-form">
      <h2 id="stopDialogTitle">添加地点</h2>

      <label class="field">
        <span>搜索地点</span>
        <input id="f-search" type="text" placeholder="配好 Maps Key 后可搜索，自动带回地址和坐标" autocomplete="off" />
      </label>

      <div class="field-row">
        <label class="field">
          <span>名称</span>
          <input id="f-name" type="text" required />
        </label>
        <label class="field field-narrow">
          <span>类型</span>
          <select id="f-category">
            <option value="attraction">🏛️ 景点</option>
            <option value="food">🍜 吃饭</option>
            <option value="hotel">🏨 住宿</option>
            <option value="outdoor">🏞️ 户外</option>
            <option value="shopping">🛍️ 购物</option>
            <option value="transport">✈️ 交通</option>
            <option value="other">📍 其他</option>
          </select>
        </label>
      </div>

      <label class="field">
        <span>地址</span>
        <input id="f-address" type="text" />
      </label>

      <div class="field-row">
        <label class="field"><span>纬度 lat</span><input id="f-lat" type="text" inputmode="decimal" /></label>
        <label class="field"><span>经度 lng</span><input id="f-lng" type="text" inputmode="decimal" /></label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>停留（分钟）</span>
          <input id="f-stay" type="number" min="0" step="1" inputmode="numeric" />
        </label>
        <label class="field">
          <span>怎么过来</span>
          <select id="f-mode">
            <option value="UBER">🚕 Uber</option>
            <option value="RENTAL">🚗 租车</option>
            <option value="TOUR">🚌 旅行团</option>
            <option value="TRANSIT">🚇 公共交通</option>
            <option value="WALKING">🚶 步行</option>
            <option value="BICYCLING">🚲 骑行</option>
          </select>
        </label>
        <label class="field">
          <span>固定时间</span>
          <input id="f-fixed" type="time" title="有预约 / 门票时段时填，系统会倒推最晚出发时间" />
        </label>
      </div>

      <div class="field-row">
        <label class="field">
          <span>路上时间（分钟）</span>
          <input id="f-travel" type="number" min="0" step="1" inputmode="numeric"
                 placeholder="留空＝按地图算；坐飞机请自己填" />
        </label>
        <label class="field">
          <span>当地时区 <span id="tz-status" class="field-note"></span></span>
          <input id="f-tz" list="tzList" type="text" placeholder="跨时区才填，例 Asia/Manila" autocomplete="off" />
        </label>
      </div>

      <label class="check-field">
        <input id="f-rest" type="checkbox" />
        <span>这段算休息，不计入游玩时间<em id="restHint" class="field-note"></em></span>
      </label>

      <label class="field">
        <span>营业时间 <span id="hours-status" class="field-note"></span></span>
        <input id="f-hours" type="text" placeholder="例：Mo-Fr 09:00-17:00　或　24/7　（从搜索结果选地点时会自动填）" autocomplete="off" />
      </label>

      <label class="field">
        <span>备注</span>
        <textarea id="f-notes" rows="2" placeholder="订位号、停车提示、必点菜…"></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" id="stopCancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 邀请朋友 -->
  <dialog id="shareDialog" class="dialog">
    <div class="dialog-form">
      <h2>邀请朋友一起改</h2>
      <p class="dialog-hint" id="shareHint"></p>
      <label class="field">
        <span>行程链接</span>
        <input id="shareLink" type="text" readonly />
      </label>
      <div class="share-actions">
        <button id="shareCopy" class="primary-btn">复制链接</button>
        <button id="shareSystem" class="tool-btn">分享到…</button>
      </div>
      <p class="dialog-hint" id="shareInstallHint"></p>
      <div id="shareMembers" class="share-members"></div>
      <div class="dialog-actions">
        <button type="button" id="shareClose" class="tool-btn">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 顺序建议 -->
  <dialog id="reorderDialog" class="dialog">
    <div class="dialog-form">
      <h2>换个顺序可能少绕点路</h2>
      <p class="dialog-hint" id="reorderHint"></p>
      <div class="reorder-compare">
        <div class="reorder-col">
          <div class="reorder-head">现在</div>
          <ol id="reorderNow" class="reorder-list"></ol>
        </div>
        <div class="reorder-col">
          <div class="reorder-head is-new">建议</div>
          <ol id="reorderNext" class="reorder-list"></ol>
        </div>
      </div>
      <p class="dialog-hint">按直线距离估的，只作参考。固定时间的地点、每天第一个和最后一个都没动。
        你要是有别的考虑（顺路买东西、跟人约了、想避开人多的时段），忽略就好。</p>
      <div class="dialog-actions">
        <button type="button" id="reorderNever" class="tool-btn">这天不用再提</button>
        <button type="button" id="reorderClose" class="tool-btn">先不改</button>
        <button type="button" id="reorderApply" class="primary-btn">按这个顺序排</button>
      </div>
    </div>
  </dialog>

  <!-- 用链接打开某份行程 -->
  <dialog id="restoreDialog" class="dialog">
    <form id="restoreForm" method="dialog" class="dialog-form">
      <h2 id="restoreTitle">打开行程链接</h2>
      <p class="dialog-hint" id="restoreHint">把「👥 邀请」复制出来的链接粘进来，就会打开那份行程。</p>
      <label class="field">
        <span>行程链接</span>
        <textarea id="f-link" rows="3" placeholder="https://….github.io/US--routine/?trip=…" autocomplete="off"></textarea>
      </label>
      <div class="dialog-actions">
        <button type="button" id="restoreSkip" class="tool-btn">先用示例行程</button>
        <button type="button" id="restoreCancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">打开</button>
      </div>
    </form>
  </dialog>

  <!-- 修改记录 -->
  <dialog id="historyDialog" class="dialog">
    <div class="dialog-form">
      <div class="history-head">
        <h2>修改记录 <span id="historyCount" class="history-count"></span></h2>
        <button id="historyMineBtn" class="tool-btn">只看我的</button>
      </div>
      <div id="historyList" class="history-list"></div>
      <div class="dialog-actions">
        <button type="button" id="historyClose" class="tool-btn">关闭</button>
      </div>
    </div>
  </dialog>

  <!-- 设置 -->
  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" method="dialog" class="dialog-form">
      <h2>设置</h2>

      <label class="field">
        <span>我的昵称（朋友会看到）</span>
        <input id="f-nick" type="text" maxlength="12" />
      </label>

      <label class="field">
        <span>地图服务</span>
        <select id="f-provider">
          <option value="">自动（有 Google Key 就用 Google，否则用 OpenStreetMap）</option>
          <option value="osm">OpenStreetMap（免费，不用信用卡）</option>
          <option value="google">Google 地图（需要 Key 和已绑卡的账号）</option>
        </select>
      </label>

      <label class="field" id="field-ors">
        <span>OpenRouteService Key（算真实路程用，<a href="https://openrouteservice.org/dev/#/signup" target="_blank" rel="noopener">邮箱注册免费领</a>）</span>
        <input id="f-ors" type="text" placeholder="不填也能看地图，只是路程按直线估算" autocomplete="off" />
      </label>

      <label class="field" id="field-gmaps">
        <span>Google Maps API Key</span>
        <input id="f-key" type="text" placeholder="AIza..." autocomplete="off" />
      </label>

      <label class="field">
        <span>Firebase 配置（从控制台复制的 firebaseConfig 对象，直接粘贴）</span>
        <textarea id="f-fb" rows="6" placeholder='{ "apiKey": "...", "authDomain": "...", "databaseURL": "https://xxx.firebasedatabase.app", "projectId": "...", "appId": "..." }'></textarea>
      </label>

      <p class="dialog-hint" id="configSource"></p>

      <div class="dialog-actions">
        <button type="button" id="settingsClear" class="tool-btn">清除本地配置</button>
        <button type="button" id="settingsCancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">保存并刷新</button>
      </div>
    </form>
  </dialog>

  <script src="js/app-config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/hours.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/model.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/maps-google.js"></script>
  <script src="js/maps-osm.js"></script>
  <script src="js/maps.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/dragsort.js"></script>
  <script src="js/app.js"></script>
  <datalist id="tzList"></datalist>
</body>
</html>
